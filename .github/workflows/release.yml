name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      # npm trusted publishing (OIDC): no long-lived NPM_TOKEN to expire
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Configure npm publishing
        id: npm-publish
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [ "$NPM_PUBLISH_ENABLED" = "true" ]; then
            echo "command=vp run release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # v2 supports Changesets CLI v3: v1 parsed CLI v2 output and silently skipped tags and
        # GitHub releases (the missing @zorsh/zorsh@0.5.2 tag)
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp run version-packages
          publish-script: ${{ steps.npm-publish.outputs.command }}
        env:
          # Empty on purpose: npm authenticates through the workflow's OIDC token
          # (trusted publishers on npmjs.com: @zorsh/zorsh and @zorsh/effect; see CONTRIBUTING.md).
          NPM_TOKEN: ""
