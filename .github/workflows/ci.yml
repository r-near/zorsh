name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting, lint and types
        run: vp check

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Regenerate Rust compatibility fixtures
        run: cargo test --locked -j 1 --manifest-path rust/borsh_test/Cargo.toml -- --include-ignored
      - name: Check fixture drift
        run: git diff --exit-code -- rust/borsh_test/test_data
      - name: Run tests with coverage
        run: vp test run --coverage
      - name: Build library
        run: vp -C packages/zorsh pack
      - name: Create npm tarball
        run: vp -C packages/zorsh pm pack -- --pack-destination ../../.artifacts
      - name: Verify installed tarball consumers
        run: vp run check-package
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
