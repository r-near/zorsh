name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pinned oracle Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Cache Rust oracle dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/borsh-oracle
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check formatting, lint and types
        run: vp check
      - name: Check Rust oracle formatting
        run: cargo +1.98.0 fmt --manifest-path rust/borsh-oracle/Cargo.toml --check
      - name: Lint Rust oracle and its tests
        run: cargo +1.98.0 clippy --locked -j 1 --manifest-path rust/borsh-oracle/Cargo.toml --all-targets -- -D warnings

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pinned oracle Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Cache Rust compatibility dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rust/borsh_test
            rust/borsh-oracle
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          node-version-file: .node-version
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Regenerate Rust compatibility fixtures
        run: cargo test --locked -j 1 --manifest-path rust/borsh_test/Cargo.toml -- --include-ignored
      - name: Check fixture drift
        run: |
          fixture_status=$(git status --porcelain --untracked-files=all -- rust/borsh_test/test_data)
          if [ -n "$fixture_status" ]; then
            printf '%s\n' "$fixture_status"
            exit 1
          fi
      - name: Test Rust oracle conformance, properties and persistent CLI
        run: cargo +1.98.0 test --locked -j 1 --manifest-path rust/borsh-oracle/Cargo.toml
      - name: Build Rust differential oracle
        run: cargo +1.98.0 build --locked -j 1 --manifest-path rust/borsh-oracle/Cargo.toml
      - name: Build libraries
        run: vp run build
      - name: Create public package tarball
        run: vp -C packages/zorsh pm pack -- --pack-destination ../../.artifacts
      - name: Run tests with coverage
        run: vp test run --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
